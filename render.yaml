services:
  - type: web
    name: blacklist-app
    runtime: docker
    plan: free
    rootDir: blacklist_app
    healthCheckPath: /blacklists/ping
    envVars:
      - key: BEARER_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blacklist-db
          property: connectionString

databases:
  - name: blacklist-db
    plan: free
    databaseName: blacklist_db
    user: blacklist_user
